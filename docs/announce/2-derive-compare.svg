<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111b2e"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#60a5fa"/></linearGradient><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8b949e"/></marker></defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<text x="80" y="130" font-size="34" fill="#2dd4bf" letter-spacing="6" font-weight="600">HOW IT WORKS</text>
<text x="80" y="230" font-size="76" font-weight="800" fill="#e6edf3">Derive, then compare.</text>
<text x="80" y="300" font-size="34" fill="#8b949e">An export claims more than a kernel needs to believe.</text>
<rect x="80" y="360" width="440" height="300" rx="20" fill="#0f1a2c" stroke="#f59e0b" stroke-width="4"/><text x="110" y="418" font-size="36" font-weight="700" fill="#f59e0b">The export says</text><text x="110" y="470" font-size="30" fill="#e6edf3">constructors</text><text x="110" y="514" font-size="30" fill="#e6edf3">recursor types</text><text x="110" y="558" font-size="30" fill="#e6edf3">recursor rules</text><text x="110" y="602" font-size="30" fill="#e6edf3">isRec, numNested, k …</text><rect x="580" y="360" width="440" height="300" rx="20" fill="#0f1a2c" stroke="#2dd4bf" stroke-width="4"/><text x="610" y="418" font-size="36" font-weight="700" fill="#2dd4bf">The kernel derives</text><text x="610" y="470" font-size="30" fill="#e6edf3">from the types and</text><text x="610" y="514" font-size="30" fill="#e6edf3">constructor types only,</text><text x="610" y="558" font-size="30" fill="#e6edf3">like Lean's own kernel</text><text x="610" y="602" font-size="30" fill="#e6edf3">does</text><rect x="1080" y="360" width="440" height="300" rx="20" fill="#0f1a2c" stroke="#f87171" stroke-width="4"/><text x="1110" y="418" font-size="36" font-weight="700" fill="#f87171">Any difference</text><text x="1110" y="470" font-size="30" fill="#e6edf3">is a rejection</text><text x="1110" y="514" font-size="30" fill="#e6edf3"></text><text x="1110" y="558" font-size="30" fill="#e6edf3">mutated exports are</text><text x="1110" y="602" font-size="30" fill="#e6edf3">all rejected</text>
<line x1="522" y1="510" x2="576" y2="510" stroke="#8b949e" stroke-width="5" marker-end="url(#ar)"/>
<line x1="1022" y1="510" x2="1076" y2="510" stroke="#8b949e" stroke-width="5" marker-end="url(#ar)"/>
<text x="80" y="730" font-size="34" fill="#e6edf3">Mutual and nested inductives included: auxiliary types are built,</text>
<text x="80" y="776" font-size="34" fill="#e6edf3">checked, and translated back before comparing.</text></g>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26"><text x="80" y="850" fill="#8b949e">github.com/keithadler/tenet-jvm</text>
<text x="1520" y="850" fill="#8b949e" text-anchor="end">Apache-2.0 · Java 21 · no dependencies</text></g>
<rect x="80" y="800" width="1440" height="2" fill="#243247"/></svg>