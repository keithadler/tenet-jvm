<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111b2e"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#60a5fa"/></linearGradient></defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<text x="80" y="150" font-size="34" fill="#2dd4bf" letter-spacing="6" font-weight="600">NEW · OPEN SOURCE</text>
<text x="80" y="330" font-size="150" font-weight="800" fill="#e6edf3">tenet-jvm</text>
<rect x="80" y="360" width="520" height="8" rx="4" fill="url(#ac)"/>
<text x="80" y="470" font-size="58" fill="#e6edf3">An independent <tspan fill="#2dd4bf" font-weight="700">Lean 4 kernel</tspan></text>
<text x="80" y="545" font-size="58" fill="#e6edf3">written in Java.</text>
<text x="80" y="650" font-size="36" fill="#8b949e">Re-checks Lean proofs from scratch, so a bug in one kernel</text>
<text x="80" y="700" font-size="36" fill="#8b949e">can't hide in all of them.</text></g>
<g transform="translate(1090,170)" font-family="Menlo, SF Mono, monospace" font-size="26">
<rect width="430" height="420" rx="22" fill="#0f1a2c" stroke="#243247" stroke-width="3"/>
<text x="30" y="60" fill="#8b949e">$ tenet-jvm lean.ndjson</text>
<text x="30" y="120" fill="#e6edf3">171,705 constants</text>
<text x="30" y="165" fill="#e6edf3">2,860 inductive groups</text>
<text x="30" y="260" fill="#2dd4bf" font-size="28">✓ all verified</text>
<text x="30" y="330" fill="#8b949e" font-size="24">exit code 0</text></g>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26"><text x="80" y="850" fill="#8b949e">github.com/keithadler/tenet-jvm</text>
<text x="1520" y="850" fill="#8b949e" text-anchor="end">Apache-2.0 · Java 21 · no dependencies</text></g>
<rect x="80" y="800" width="1440" height="2" fill="#243247"/></svg>